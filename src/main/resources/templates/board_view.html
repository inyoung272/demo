<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        
        <h1 class="mt-5">현재 게시글 내용보기</h1>

        <div class="mt-5">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                        <th>좋아요</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td th:text="${boards.id}"></td>
                        <td th:text="${boards.title}"></td>
                        <td th:text="${boards.user}"></td>
                        <td th:text="${boards.newdate}"></td>
                        <td th:text="${boards.count}"></td>
                        <td th:text="${boards.likec}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="card mb-4">
                <div class="card-header">
                    <strong>글내용</strong>
                </div>
                <div class="card-body">
                    <p class="card-text" th:text="${boards.content}"></p>
                </div>
            </div>

            <div class="d-flex">
                
                <div th:if="${boards.user == loginUser}" class="d-flex">
                    <a class="btn btn-warning mr-2" th:href="@{/board_edit/{id}(id=${boards.id})}">수정</a>

                    <form th:action="@{/api/board_delete/{id}(id=${boards.id})}" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </form>
                </div>

                <a href="/board_list" class="btn btn-secondary ml-2">목록</a>
            </div>

        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
